<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Math Square Dev</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <form id="form">
      <label>sensors:
        <select name="sensors">
          <option value="null">Off</option>
          <option value="raindrop" selected>Random</option>
          <option value="bl">Server</option>
          <option value="afr">Recording</option>
        </select>
      </label>
      <label>mouse:
        <input type="checkbox" name="mouseCheckBox">
      </label>
      <input type="file" id="afrFileInput" accept=".afr" style="display:none">
      <span id="afrProgress" style="display:none; margin-left:8px; font-size:12px; color:#888;"></span>
    </form>
    <div id="scene"></div>
  </body>
</html>
